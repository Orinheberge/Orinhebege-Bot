name: Deploy Bot to Production & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  DEPLOY_PATH: /var/lib/pterodactyl/volumes/8e4cb01d-97ad-42f7-a9c8-9e21c859d26b
  SSH_HOST: 5.48.143.126
  SSH_USER: root

jobs:
  # =============================================
  # JOB 1 : DÉPLOIEMENT
  # =============================================
  deploy:
    name: 🚀 Deploy to Pterodactyl
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.vars.outputs.sha }}
      commit_msg: ${{ steps.vars.outputs.msg }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Output Variables
        id: vars
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          MSG=$(git log -1 --pretty=%s | sed 's/"/\\"/g')
          echo "msg=${MSG}" >> $GITHUB_OUTPUT

      - name: Install rsync & sshpass
        run: sudo apt-get update && sudo apt-get install -y rsync sshpass

      - name: Check required secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.SSH_PASSWORD }}" ] && MISSING="$MISSING SSH_PASSWORD"
          [ -z "${{ secrets.DISCORD_TOKEN }}" ] && MISSING="$MISSING DISCORD_TOKEN"
          [ -z "${{ secrets.DISCORD_CLIENT_ID }}" ] && MISSING="$MISSING DISCORD_CLIENT_ID"
          [ -z "${{ secrets.DISCORD_CLIENT_SECRET }}" ] && MISSING="$MISSING DISCORD_CLIENT_SECRET"
          [ -z "${{ secrets.DISCORD_GUILD_ID }}" ] && MISSING="$MISSING DISCORD_GUILD_ID"
          [ -z "${{ secrets.PANEL_PASSWORD }}" ] && MISSING="$MISSING PANEL_PASSWORD"
          [ -z "${{ secrets.PTERO_API_KEY }}" ] && MISSING="$MISSING PTERO_API_KEY"
          [ -z "${{ secrets.PTERO_SERVER_ID }}" ] && MISSING="$MISSING PTERO_SERVER_ID"
          if [ -n "$MISSING" ]; then
            echo "❌ Secrets manquants :$MISSING"
            exit 1
          fi
          echo "✅ Tous les secrets requis sont présents"

      # --- Étape 1 : Rsync des fichiers ---
      - name: Deploy files via rsync
        env:
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASS" rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.example' \
            --exclude='node_modules/' \
            --exclude='*.log' \
            --exclude='database.json' \
            --exclude='warns.json' \
            --exclude='levels.json' \
            --exclude='reglement.json' \
            --exclude='config.json' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='lastRestart.json' \
            -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10" \
            ./ \
            ${{ env.SSH_USER }}@${{ env.SSH_HOST }}:${{ env.DEPLOY_PATH }}/

      # --- Étape 2 : Créer le .env sur le serveur ---
      - name: Create .env on server
        env:
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            ${{ env.SSH_USER }}@${{ env.SSH_HOST }} \
            "cat > ${{ env.DEPLOY_PATH }}/.env << 'ENVEOF'
          DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET=${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_GUILD_ID=${{ secrets.DISCORD_GUILD_ID }}
          BOT_PREFIX=${{ secrets.BOT_PREFIX || '!' }}
          PANEL_PASSWORD=${{ secrets.PANEL_PASSWORD }}
          PANEL_BASE_URL=${{ secrets.PANEL_BASE_URL || 'https://node.orinstone.deepstone.fr:26162' }}
          PANEL_ALLOWED_ROLES=${{ secrets.PANEL_ALLOWED_ROLES || '' }}
          WEB_PORT=${{ secrets.WEB_PORT || '26162' }}
          CONSOLE_CHANNEL_ID=${{ secrets.CONSOLE_CHANNEL_ID || '' }}
          CONSOLE_OWNERS=${{ secrets.CONSOLE_OWNERS || '' }}
          PTERO_API_KEY=${{ secrets.PTERO_API_KEY }}
          PTERO_SERVER_ID=${{ secrets.PTERO_SERVER_ID }}
          PTERO_PANEL_URL=${{ secrets.PTERO_PANEL_URL || 'https://panel.orinstone.deepstone.fr' }}
          ENVEOF"

      # --- Étape 3 : npm install + permissions ---
      - name: Install dependencies & set permissions
        env:
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            ${{ env.SSH_USER }}@${{ env.SSH_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && \
             npm ci --omit=dev --no-audit --no-fund 2>/dev/null || npm install --omit=dev --no-audit --no-fund && \
             chmod 600 .env && \
             chown -R 1000:1000 ${{ env.DEPLOY_PATH }} && \
             chmod -R 755 ${{ env.DEPLOY_PATH }} && \
             echo '✅ Dépendances installées et permissions OK'"

      # --- Étape 4 : Redémarrage via API Pterodactyl ---
      - name: Restart via Pterodactyl API
        env:
          PTERO_API_KEY: ${{ secrets.PTERO_API_KEY }}
          PTERO_SERVER_ID: ${{ secrets.PTERO_SERVER_ID }}
        run: |
          echo "🔄 Redémarrage du serveur Pterodactyl..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${PTERO_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"signal": "restart"}' \
            "https://panel.orinstone.deepstone.fr/api/client/servers/${PTERO_SERVER_ID}/power")

          if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Serveur redémarré avec succès (HTTP $HTTP_CODE)"
          else
            echo "⚠️ API Pterodactyl a répondu HTTP $HTTP_CODE"
            echo "🔄 Tentative de restart via SSH..."
          fi

      # --- Étape 5 : Fallback restart via SSH ---
      - name: Fallback restart via SSH
        if: failure()
        env:
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          echo "🔄 Tentative de redémarrage via Docker..."
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no \
            ${{ env.SSH_USER }}@${{ env.SSH_HOST }} \
            "CONTAINER_ID=\$(docker ps --format '{{.ID}} {{.Mounts}}' | grep '8e4cb01d' | awk '{print \$1}' | head -1) && \
             if [ -n \"\$CONTAINER_ID\" ]; then \
               docker exec \$CONTAINER_ID pkill -f 'node' 2>/dev/null || true; \
               echo '✅ Processus node arrêté (watchdog va relancer)'; \
             else \
               echo '⚠️ Conteneur non trouvé, vérifiez manuellement'; \
             fi"

  # =============================================
  # JOB 2 : RELEASE
  # =============================================
  release_and_notify:
    name: 📦 Create Release
    needs: deploy
    runs-on: ubuntu-latest
    if: needs.deploy.result == 'success'
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and create Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: "v"
          default_bump: "patch"

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG="${{ steps.tag_version.outputs.previous_tag }}"
          NEW_TAG="${{ steps.tag_version.outputs.new_tag }}"

          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "null" ]; then
            LOG=$(git log HEAD --pretty=format:"- %s (%h)" --reverse | tail -20)
          else
            LOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --reverse)
          fi

          if [ -z "$LOG" ]; then
            LOG="- Mise à jour automatique"
          fi

          {
            echo 'changelog<<EOF'
            echo "$LOG"
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: "Release ${{ steps.tag_version.outputs.new_tag }}"
          body: |
            ## 🤖 Déploiement Bot Discord Orinstone

            | Info | Valeur |
            |------|--------|
            | **Version** | `${{ steps.tag_version.outputs.new_tag }}` |
            | **Commit** | `${{ needs.deploy.outputs.commit_sha }}` |
            | **Message** | ${{ needs.deploy.outputs.commit_msg }} |
            | **Acteur** | @${{ github.actor }} |

            ### 📋 Changelog
            ${{ steps.changelog.outputs.changelog }}

            ---
            *Déploiement automatique via GitHub Actions*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =============================================
  # JOB 3 : NOTIFICATION DISCORD
  # =============================================
  notify:
    name: 💬 Notify Discord
    runs-on: ubuntu-latest
    needs: [deploy, release_and_notify]
    if: always()

    steps:
      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "color=2263842" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "title=Déploiement réussi" >> $GITHUB_OUTPUT
          else
            echo "color=15548997" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "title=Échec du déploiement" >> $GITHUB_OUTPUT
          fi

      - name: Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.deploy.result }}
          title: "${{ steps.status.outputs.emoji }} ${{ steps.status.outputs.title }}"
          description: |
            <@&1521937325595037906>
            **Version:** ${{ needs.release_and_notify.outputs.new_tag || 'N/A' }}
            **Commit:** `${{ needs.deploy.outputs.commit_sha || 'N/A' }}`
            **Message:** ${{ needs.deploy.outputs.commit_msg || 'N/A' }}
            **Acteur:** ${{ github.actor }}
          color: ${{ steps.status.outputs.color }}
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          username: "Orinstone CI/CD"
          avatar_url: "https://heberge.deepstone.fr/favicon.ico"