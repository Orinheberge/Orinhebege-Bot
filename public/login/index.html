<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Orinstone Panel</title>
    <link rel="shortcut icon" href="https://heberge.deepstone.fr/favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="text-white flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full mx-4 fade-in">
        <div class="glass rounded-2xl p-8 card-hover">

            <!-- Logo -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-purple-500/20 mb-4">
                    <i class="fa-solid fa-cube text-purple-400 text-3xl"></i>
                </div>
                <h1 class="text-3xl font-bold">Orinstone Panel</h1>
                <p class="text-gray-400 mt-2">Connectez-vous avec votre compte Discord</p>
            </div>

            <!-- Erreur -->
            <div id="error" class="hidden bg-red-500/20 border border-red-500/50 text-red-300 px-4 py-3 rounded-xl text-sm text-center mb-6"></div>

            <!-- Bouton Discord OAuth2 -->
            <a href="/api/auth/login" id="discordBtn"
                class="w-full bg-[#5865F2] hover:bg-[#4752C4] py-4 rounded-xl font-semibold transition flex items-center justify-center gap-3 text-lg">
                <i class="fa-brands fa-discord text-2xl"></i>
                Se connecter avec Discord
            </a>

            <!-- Séparateur -->
            <div class="flex items-center gap-4 my-6">
                <div class="flex-1 h-px bg-white/10"></div>
                <span class="text-gray-500 text-xs uppercase">ou</span>
                <div class="flex-1 h-px bg-white/10"></div>
            </div>

            <!-- Fallback mot de passe (ancien système) -->
            <details class="group">
                <summary class="cursor-pointer text-gray-400 hover:text-gray-300 text-sm text-center transition list-none">
                    <i class="fa-solid fa-key mr-1"></i> Connexion par mot de passe
                </summary>
                <form id="passwordForm" class="mt-4 space-y-4">
                    <input type="password" id="password" required
                        class="w-full px-4 py-3 bg-slate-800/80 border border-slate-600 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent focus:outline-none transition placeholder-gray-500"
                        placeholder="Mot de passe administrateur">
                    <button type="submit" id="submitBtn"
                        class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 py-3 rounded-xl font-semibold transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-right-to-bracket"></i> Se connecter
                    </button>
                </form>
            </details>

            <!-- Info -->
            <div class="mt-6 bg-slate-800/50 rounded-xl p-4">
                <p class="text-gray-400 text-xs text-center">
                    <i class="fa-solid fa-shield-halved text-green-400 mr-1"></i>
                    Vous devez être membre du serveur Discord Orinstone
                    et posséder un rôle autorisé pour accéder au panel.
                </p>
            </div>
        </div>

        <p class="text-center text-gray-500 text-sm mt-6">&copy; 2026 Orinstone Network</p>
    </div>

    <script>
        // Afficher l'erreur si présente dans l'URL
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error');
        if (error) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = decodeURIComponent(error);
            errorDiv.classList.remove('hidden');
        }

        // Fallback mot de passe
        document.getElementById('passwordForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('error');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connexion...';
            errorDiv.classList.add('hidden');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password }),
                    credentials: 'include'
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('panelToken', data.token);
                    window.location.href = '/';
                } else {
                    errorDiv.textContent = data.error || 'Mot de passe incorrect';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.textContent = 'Impossible de contacter le serveur.';
                errorDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Se connecter';
            }
        });
    </script>
</body>
</html>
